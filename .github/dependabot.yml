version: 2
# Every entry waits 7 days after a release before proposing it.
updates:
  # Minor/patch bumps are grouped into one weekly PR. The 12 PRs just closed
  # on this repo were stale artifacts from before the TypeScript/TypeORM
  # rewrite, left open indefinitely with no config driving them - grouping
  # keeps a fresh setup from accumulating the same kind of clutter.
  - package-ecosystem: "npm"
    directory: "/"
    # Updates run in dev first, like every change to what runs.
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
